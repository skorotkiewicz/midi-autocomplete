[project]
name = "midilm"
version = "0.1.0"
description = "Decoder-only transformer for real-time MIDI continuation"
readme = "README.md"
authors = [
    { name = "Sebastian Korotkiewicz", email = "skorotkiewicz@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mido>=1.3.3",
    "numpy>=2.5.2",
    "tqdm>=4.70.0",
]

[project.scripts]
midilm = "midilm:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]
cpu = [
    "torch==2.9.1",
]
gpu = [
    "torch==2.9.1",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]
