[package]
name = "midi-autocomplete"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = "0.11.4"
midir = "0.11.0"
midly = { version = "0.5.3", default-features = false, features = ["std"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
rustysynth = "1.3.6"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.4"
